<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>บันทึกการกินนมทะเล</title>
    
    <!-- โหลดฟอนต์ Mitr ครบถ้วน -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- โหลดไลบรารีสำหรับวาดกราฟ -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        :root {
            --bg-color: #161920;
            --card-bg: #1e222b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --green-glow: #4ade80;
            --orange-glow: #f97316;
            --shadow-dark: #0f1115;
            --shadow-light: #2d3341;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Mitr', sans-serif !important;
        }
        
        html, body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            width: 100%;
            height: 100%; 
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        
        /* กล่องรองรับการขยายตัวเมื่อเปิดบนเบราว์เซอร์ PC */
        .phone-container {
            width: 100%; 
            max-width: 412px; /* ขนาดมาตรฐานบนมือถือ */
            height: 100%;
            max-height: 840px;
            background: linear-gradient(145deg, #1e222b, #14171d); 
            border-radius: 40px; 
            padding: 24px 20px;
            box-shadow: 20px 20px 40px var(--shadow-dark), -10px -10px 30px var(--shadow-light); 
            display: flex; 
            flex-direction: column;
            transition: max-width 0.4s ease, max-height 0.4s ease;
        }

        /* เมนูสลับแถบหน้าจอ */
        .tab-menu {
            display: flex; 
            background: #13161c; 
            border-radius: 20px; 
            padding: 6px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -4px -4px 12px var(--shadow-light); 
            height: 56px;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; 
            font-size: 1rem; 
            border: none; 
            border-radius: 14px;
            background: transparent; 
            color: var(--text-sub); 
            cursor: pointer; 
            text-align: center;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: linear-gradient(145deg, #222731, #1a1e26); 
            color: var(--green-glow);
            font-weight: 500;
            box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px #292f3c;
        }

        .main-content {
            flex-grow: 1;
            position: relative;
            height: calc(100% - 76px);
        }

        .tab-content { 
            display: none; 
            height: 100%;
            flex-direction: column;
        }
        .tab-content.active { display: flex; }

        .top-grid { 
            display: grid; 
            grid-template-columns: 1.2fr 0.8fr; 
            gap: 16px; 
            margin-bottom: 20px;
        }
        
        .neu-card {
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 16px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative;
        }
        .donut-card {
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1a1d25, #222731);
        }

        .form-group { 
            margin-bottom: 20px;
            display: flex; 
            flex-direction: column; 
        }
        
        label { 
            display: block; 
            font-size: 0.95rem; 
            margin-bottom: 8px; 
            color: var(--text-sub); 
            padding-left: 4px;
        }
        
        input[type="number"], input[type="datetime-local"] {
            width: 100%; 
            padding: 16px; 
            font-size: 1.25rem; 
            border: none; 
            border-radius: 16px;
            background: #14171d; 
            color: #ffffff; 
            outline: none;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light);
        }

        .poop-container { 
            display: flex; 
            gap: 12px; 
            width: 100%;
        }
        .poop-box { display: none; }
        .poop-label {
            flex: 1; 
            padding: 14px 0; 
            font-size: 1.2rem; 
            text-align: center; 
            background: var(--card-bg); 
            border-radius: 16px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); 
            cursor: pointer; 
            color: var(--text-sub); 
        }
        .poop-box:checked + .poop-label {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); 
            color: var(--orange-glow);
            background: #14171d;
        }

        .bottom-grid { 
            display: grid; 
            grid-template-columns: 1fr auto; 
            gap: 16px; 
            margin-bottom: auto; 
            align-items: flex-end;
        }
        
        .settings-btn {
            width: 58px; 
            height: 58px; 
            background: var(--card-bg); 
            border: none; 
            border-radius: 16px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); 
            cursor: pointer;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 1.4rem;
        }

        .submit-btn {
            width: 100%; 
            height: 62px; 
            font-size: 1.3rem; 
            font-weight: 500; 
            border: none; 
            border-radius: 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff; 
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3), 6px 6px 12px var(--shadow-dark);
            cursor: pointer; 
            margin-top: 10px;
        }

        .status { font-size: 0.95rem; text-align: center; height: 24px; margin-top: 8px; }
        .success { color: var(--green-glow); } .loading { color: var(--orange-glow); } .error { color: #ef4444; }

        /* ปรับสถิติให้เหมาะสมกับอัตราส่วน PC */
        .chart-card {
            background: #191c24; 
            border-radius: 24px; 
            padding: 16px; 
            height: 48%;
            margin-bottom: 4%;
            box-shadow: 6px 6px 12px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            display: flex;
            flex-direction: column;
        }
        .chart-card:last-child { margin-bottom: 0; }
        .chart-title { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 12px; }
        .chart-wrapper { flex-grow: 1; width: 100%; position: relative; }

        /* ================= ปรับแต่งการจัดวางสำหรับหน้าจอ PC ================= */
        @media (min-width: 768px) {
            body {
                overflow: auto; /* ปล่อยอิสระให้พอดีหน้าต่างเบราว์เซอร์ใหญ่ */
            }
            .phone-container {
                max-width: 900px; /* ขยายกว้างขึ้นในโหมด PC เพื่อความสมดุล */
                height: 680px;
                max-height: 90vh;
                padding: 30px;
            }
            #tab1 {
                display: none;
                grid-template-columns: 1fr 1fr; /* แบ่งครึ่งฝั่งกรอกข้อมูลกับสรุปเป้าหมายบน PC */
                gap: 24px;
                height: 100%;
            }
            #tab1.active { display: grid; }
            
            .top-grid {
                grid-template-columns: 1fr;
                height: 100%;
                margin-bottom: 0;
            }
            .left-fields {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 100%;
            }
            .right-summary {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 100%;
            }
            .donut-card {
                flex-grow: 1;
                margin-bottom: 20px;
            }
            /* จัดรูปแบบหน้าสถิติให้เรียงคู่ ซ้าย-ขวา แทนการซ้อนบน-ล่าง */
            #tab2.active {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .chart-card {
                height: 100%;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('tab1')">บันทึกการกินนมทะเล</button>
            <button class="tab-btn" onclick="switchTab('tab2')">สถิติสัปดาห์นี้</button>
        </div>

        <div class="main-content">
            <!-- TAB 1: บันทึกข้อมูล -->
            <div id="tab1" class="tab-content active">
                <!-- โครงสร้างรองรับ PC Left Side -->
                <div class="left-fields">
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label for="milk_amount">ปริมาณนมที่กิน (ออนซ์)</label>
                        <input type="number" id="milk_amount" placeholder="0.0" step="0.1" required inputmode="decimal">
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>จำนวนครั้งการอึในรอบนี้</label>
                        <div class="poop-container">
                            <input type="checkbox" id="p1" name="poop" value="1" class="poop-box"><label for="p1" class="poop-label">1</label>
                            <input type="checkbox" id="p2" name="poop" value="1" class="poop-box"><label for="p2" class="poop-label">2</label>
                            <input type="checkbox" id="p3" name="poop" value="1" class="poop-box"><label for="p3" class="poop-label">3</label>
                            <input type="checkbox" id="p4" name="poop" value="1" class="poop-box"><label for="p4" class="poop-label">4</label>
                        </div>
                    </div>

                    <div class="bottom-grid">
                        <div>
                            <label for="weight">น้ำหนักวันนี้ (กก.)</label>
                            <input type="number" id="weight" placeholder="0.0" step="0.01" inputmode="decimal">
                        </div>
                        <button type="button" class="settings-btn" onclick="setGoal()">⚙️</button>
                    </div>
                </div>

                <!-- โครงสร้างรองรับ PC Right Side -->
                <div class="right-summary">
                    <div class="top-grid">
                        <div class="neu-card" style="justify-content: space-around;">
                            <label for="datetime">วันที่ / เวลา</label>
                            <input type="datetime-local" id="datetime" required style="font-size:1rem; padding:10px;">
                        </div>
                        <div class="neu-card donut-card">
                            <div style="position: relative; width: 75px; height: 75px; display: flex; align-items: center; justify-content: center;">
                                <canvas id="donutChart" width="75" height="75"></canvas>
                                <div id="donutPercent" style="position: absolute; font-size: 0.95rem; font-weight: 600; color: #ffffff;">0%</div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="statusMessage" class="status"></div>
                    <button type="submit" class="submit-btn" id="submitBtn" onclick="submitData(event)">บันทึกข้อมูล</button>
                </div>
            </div>

            <!-- TAB 2: สถิติประจำสัปดาห์ -->
            <div id="tab2" class="tab-content">
                <div class="chart-card">
                    <div class="chart-title">📊 ปริมาณกินนมรวมรายวัน (ออนซ์)</div>
                    <div class="chart-wrapper"><canvas id="milkLineChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">⚖️ พัฒนาการน้ำหนักตัวน้อง (กก.)</div>
                    <div class="chart-wrapper"><canvas id="weightLineChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://google.com';

        let dailyGoal = parseFloat(localStorage.getItem('milkGoal')) || 24;
        let todayProgress = parseFloat(localStorage.getItem('todayMilk')) || 0;
        let localStats = JSON.parse(localStorage.getItem('localStats')) || {
            days: ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'],
            milkData:,
            weightData:
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // ค้นหาปุ่มที่ถูกกด
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
            if(activeBtn) activeBtn.classList.add('active');
            
            if(tabId === 'tab2') { renderLineCharts(); }
        }

        function setNowTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').value = now.toISOString().slice(0, 16);
        }
        setNowTime();

        let donutChart;
        function initDonut() {
            const ctxDonut = document.getElementById('donutChart').getContext('2d');
            let consumed = todayProgress;
            let remaining = Math.max(0, dailyGoal - todayProgress);

            donutChart = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [consumed, remaining],
                        backgroundColor: ['#4ade80', '#2d3341'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '76%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { tooltip: { enabled: false } }
                }
            });
            updatePercentText();
        }

        function updatePercentText() {
            let percentage = Math.min(Math.round((todayProgress / dailyGoal) * 100), 100);
            if (isNaN(percentage)) percentage = 0;
            document.getElementById('donutPercent').innerText = percentage + '%';
        }

        function updateDonutUI() {
            if(!donutChart) return;
            donutChart.data.datasets.data = [todayProgress, Math.max(0, dailyGoal - todayProgress)];
            donutChart.update();
            updatePercentText();
        }

        function setGoal() {
            let newGoal = prompt("ตั้งเป้าหมายการกินนมต่อวัน (ออนซ์):", dailyGoal);
            if(newGoal && !isNaN(newGoal)) {
                dailyGoal = parseFloat(newGoal);
                localStorage.setItem('milkGoal', dailyGoal);
                updateDonutUI();
            }
        }

        function submitData(e) {
            e.preventDefault();
            const milkInput = document.getElementById('milk_amount');
            const weightInput = document.getElementById('weight');
            if(!milkInput.value) { alert('กรุณากรอกปริมาณนม'); return; }

            const statusMessage = document.getElementById('statusMessage');
            const inputMilk = parseFloat(milkInput.value);
            const inputWeight = parseFloat(weightInput.value) || 0;
            const currentDayIdx = new Date(document.getElementById('datetime').value).getDay();

            todayProgress += inputMilk;
            localStorage.setItem('todayMilk', todayProgress);
            localStats.milkData[currentDayIdx] += inputMilk;
            if(inputWeight > 0) localStats.weightData[currentDayIdx] = inputWeight;
            localStorage.setItem('localStats', JSON.stringify(localStats));
            
            updateDonutUI();

            statusMessage.className = 'status success';
            statusMessage.innerText = '⚡ บันทึกข้อมูลสำเร็จ';

            const poopCount = document.querySelectorAll('input[name="poop"]:checked').length;
            const formData = new FormData();
            formData.append('datetime', document.getElementById('datetime').value);
            formData.append('milk_amount', milkInput.value);
            formData.append('poop_count', poopCount);
            formData.append('weight', weightInput.value || 0);

            milkInput.value = '';
            weightInput.value = '';
            document.querySelectorAll('.poop-box').forEach(cb => cb.checked = false);
            setNowTime();

            fetch(WEB_APP_URL, { method: 'POST', body: formData })
            .catch(() => console.log("เครือข่ายขัดข้อง"));
            
            setTimeout(() => { statusMessage.innerText = ''; }, 2500);
        }

        const chartConfig = () => ({
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { 
                y: { grid: { color: '#232832' }, ticks: { font: { family: 'Mitr', size: 11 }, color: '#64748b' } }, 
                x: { grid: { display: false }, ticks: { font: { family: 'Mitr', size: 11 }, color: '#64748b' } } 
            }
        });
        
        let milkChart, weightChart;
        function renderLineCharts() {
            if(typeof Chart === 'undefined') return;
            if(milkChart) milkChart.destroy();
            if(weightChart) weightChart.destroy();

            milkChart = new Chart(document.getElementById('milkLineChart'), {
                type: 'line', 
                data: { labels: localStats.days, datasets: [{ data: localStats.milkData, borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.05)', fill: true, tension: 0.3, pointRadius: 3 }] }, 
                options: chartConfig()
            });

            weightChart = new Chart(document.getElementById('weightLineChart'), {
                type: 'line', 
                data: { labels: localStats.days, datasets: [{ data: localStats.weightData, borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.05)', fill: true, tension: 0.3, pointRadius: 3 }] }, 
                options: chartConfig()
            });
        }

        function lazySyncServer() {
            initDonut();
            setTimeout(() => {
                fetch(WEB_APP_URL + '?action=getStats')
                .then(res => res.json())
                .then(data => {
                    if(data.days) {
                        localStats.milkData = data.milkData;
                        localStats.weightData = data.weightData;
                        localStorage.setItem('localStats', JSON.stringify(localStats));
                        todayProgress = data.todayMilk || 0;
                        localStorage.setItem('todayMilk', todayProgress);
                        updateDonutUI();
                    }
                }).catch(e => console.log("ใช้โหมดออฟไลน์"));
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', lazySyncServer);
    </script>
</body>
</html>
